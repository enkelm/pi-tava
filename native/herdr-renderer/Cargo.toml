[package]
name = "herdr-renderer"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "Apache-2.0"
description = "Canonical Herdr GPUI terminal painter and WASM host"

[workspace]
members = ["frame", "font"]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.6" }
gpui_web = { package = "gpui-pre-web", version = "=0.3.6", default-features = false }
js-sys = "0.3"
herdr-protocol = { git = "https://github.com/penso/herdr-gpui.git", rev = "e370bf0a55b1bf3e7e7fcb5b3f130ebc1a9e68bf" }
herdr-renderer-frame = { path = "frame" }
herdr-renderer-font = { path = "font" }
image = { version = "0.25", default-features = false, features = ["png"] }
tracing = "0.1"
unicode-width = "0.2"
wasm-bindgen = "=0.2.129"
web-time = "1"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("integration-test"))'] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
