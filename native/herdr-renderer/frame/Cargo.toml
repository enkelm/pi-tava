[package]
name = "herdr-renderer-frame"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "Apache-2.0"
description = "Bounded render-only live Herdr presentation decoding"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
herdr-protocol = { git = "https://github.com/penso/herdr-gpui.git", rev = "e370bf0a55b1bf3e7e7fcb5b3f130ebc1a9e68bf" }

[lints.rust]
unsafe_code = "forbid"
